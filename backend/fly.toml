app = 'mce-logiciel-de-gestion-de-l-hopital'
primary_region = 'jnb'

[build]
  builder = "paketobuildpacks/builder:base"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024